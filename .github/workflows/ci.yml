name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Test contentc
        run: python -m pytest tools/contentc/tests -q
      - name: Validate content
        working-directory: tools/contentc
        run: |
          python -m contentc validate ../../content
          python -m contentc stats ../../content

  android:
    name: Build, lint and unit tests
    runs-on: ubuntu-latest
    needs: content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Unit tests
        run: ./gradlew test -PwarningsAsErrors=true
      - name: Assemble and lint
        run: ./gradlew :app:assembleDebug :app:lintDebug -PwarningsAsErrors=true
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: goalocus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
