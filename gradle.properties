# Gradle daemon and Kotlin compiler memory.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -Xmx4g
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -Xmx3g

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official

# Python 3.11+ used to compile content/ into the app's content pack (no packages needed).
# On Windows you may need: goalocus.python=py  (or python). Override in ~/.gradle/gradle.properties.
goalocus.python=python3
